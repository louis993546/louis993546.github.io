name: CI (Build Verification)

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Processed Images
        uses: actions/cache@v6
        with:
          path: .image-cache
          key: image-cache-${{ hashFiles('src/assets/images/**', 'src/utils/*.js', 'src/utils/*.swift') }}
          restore-keys: |
            image-cache-
            Linux-image-cache-

      - name: Build Static Site
        run: npm run build

      - name: Upload Built Site
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: _site
          retention-days: 1

  lighthouse:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Download Built Site
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: _site

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
